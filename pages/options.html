<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>블랙리스트 관리 대시보드</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="dashboard-layout">
    <!-- 사이드바 / 헤더 -->
    <header class="top-nav">
      <div class="brand">
        <span class="logo-icon">🛡️</span>
        <div>
          <h1>Web Blacklist & Annotator</h1>
          <p>등록된 블랙리스트, 메모 및 백업 통합 관리</p>
        </div>
      </div>
      <div class="header-actions">
        <button id="exportBtn" class="btn btn-outline">📥 JSON 내보내기</button>
        <label class="btn btn-outline file-label">
          📤 JSON 가져오기
          <input type="file" id="importFileInput" accept=".json" style="display: none;">
        </label>
      </div>
    </header>

    <main class="main-content">
      <!-- 통계 카드 -->
      <section class="stats-row">
        <div class="stat-card">
          <span class="stat-num" id="totalCount">0</span>
          <span class="stat-label">전체 등록 규칙</span>
        </div>
        <div class="stat-card block">
          <span class="stat-num" id="blockCount">0</span>
          <span class="stat-label">🚫 사전 차단</span>
        </div>
        <div class="stat-card warn">
          <span class="stat-num" id="warnCount">0</span>
          <span class="stat-label">⚠️ 경고 & 메모</span>
        </div>
        <div class="stat-card hide">
          <span class="stat-num" id="hideCount">0</span>
          <span class="stat-label">👁️ 링크 숨김</span>
        </div>
      </section>

      <!-- 수동 규칙 추가 카드 -->
      <section class="card add-card">
        <h2>새 규칙 직접 추가</h2>
        <form id="addRuleForm" class="add-form">
          <div class="form-row">
            <div class="form-col flex-2">
              <label>대상 (도메인, URL, 또는 웹스토어 32자리 ID)</label>
              <input type="text" id="newTarget" placeholder="예: bad-domain.com 또는 [32자리 확장ID]" required>
            </div>
            <div class="form-col">
              <label>유형</label>
              <select id="newType">
                <option value="domain">도메인 전체</option>
                <option value="url">특정 URL</option>
                <option value="webstore">크롬 웹스토어 ID</option>
              </select>
            </div>
            <div class="form-col">
              <label>처리 액션</label>
              <select id="newAction">
                <option value="block">🚫 사전 차단</option>
                <option value="warn">⚠️ 경고 & 메모</option>
                <option value="hide">👁️ 링크 숨김</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-col flex-3">
              <label>사유 메모</label>
              <input type="text" id="newMemo" placeholder="차단/주의를 권고하는 구체적인 사유를 적어주세요">
            </div>
            <div class="form-col btn-col">
              <button type="submit" class="btn btn-primary">규칙 추가</button>
            </div>
          </div>
        </form>
      </section>

      <!-- 목록 관리 카드 -->
      <section class="card list-card">
        <div class="list-header">
          <h2>등록된 규칙 목록</h2>
          <div class="filter-controls">
            <input type="text" id="searchInput" placeholder="대상 또는 메모 검색..." class="search-input">
            <div class="filter-tabs">
              <button class="tab-btn active" data-filter="all">전체</button>
              <button class="tab-btn" data-filter="block">차단</button>
              <button class="tab-btn" data-filter="warn">경고</button>
              <button class="tab-btn" data-filter="hide">숨김</button>
            </div>
          </div>
        </div>

        <div class="table-container">
          <table class="rules-table">
            <thead>
              <tr>
                <th>대상 및 유형</th>
                <th>액션</th>
                <th>기록된 사유 메모</th>
                <th>등록일</th>
                <th style="text-align: center;">관리</th>
              </tr>
            </thead>
            <tbody id="rulesTableBody">
              <!-- 동적 생성 -->
            </tbody>
          </table>
          <div id="emptyMsg" class="empty-msg" style="display: none;">
            등록된 블랙리스트 규칙이 없습니다.
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="options.js"></script>
</body>
</html>
