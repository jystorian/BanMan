<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>BanMan 대시보드</title>
  <link rel="icon" type="image/png" href="../icons/icon-16.png">
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="dashboard-layout">
    <!-- 사이드바 / 헤더 -->
    <header class="top-nav">
      <div class="brand">
        <img src="../icons/face-b-badge-128.png" class="brand-avatar" alt="BanMan">
        <div>
          <h1 data-i18n="dashboard_title">BanMan 대시보드</h1>
          <p data-i18n="dashboard_desc">Ban & Flag bad URLs for Chrome city</p>
        </div>
      </div>
      <div class="header-actions">
        <select id="langSelect" class="lang-select" title="Language / 언어">
          <option value="ko">🇰🇷 한국어</option>
          <option value="en">🇺🇸 English</option>
          <option value="ja">🇯🇵 日本語</option>
        </select>
        <button id="exportBtn" class="btn btn-outline" data-i18n="export_json">📥 JSON 내보내기</button>
        <label class="btn btn-outline file-label">
          <span data-i18n="import_json">📤 JSON 가져오기</span>
          <input type="file" id="importFileInput" accept=".json" style="display: none;">
        </label>
      </div>
    </header>

    <main class="main-content">
      <!-- 통계 카드 -->
      <section class="stats-row">
        <div class="stat-card">
          <span class="stat-num" id="totalCount">0</span>
          <span class="stat-label" data-i18n="stat_total">전체 등록 규칙</span>
        </div>
        <div class="stat-card block">
          <span class="stat-num" id="blockCount">0</span>
          <span class="stat-label"><span class="stat-icon">🚫</span> <span data-i18n="stat_block">사전 차단</span></span>
        </div>
        <div class="stat-card warn">
          <span class="stat-num" id="warnCount">0</span>
          <span class="stat-label"><span class="stat-icon">⚠️</span> <span data-i18n="stat_warn">주의</span></span>
        </div>
        <div class="stat-card hide">
          <span class="stat-num" id="hideCount">0</span>
          <span class="stat-label"><span class="stat-icon"><svg class="icon-closed-eye stat-icon-svg" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 10s4 6 10 6 10-6 10-6"/><path d="m5 14-1.8 2.3"/><path d="m9 16.5-0.8 2.8"/><path d="m15 16.5 0.8 2.8"/><path d="m19 14 1.8 2.3"/></svg></span> <span data-i18n="stat_hide">링크 숨김</span></span>
        </div>
      </section>

      <!-- 수동 규칙 추가 카드 -->
      <section class="card add-card">
        <h2 data-i18n="add_card_title">새 규칙 직접 추가</h2>
        <form id="addRuleForm" class="add-form">
          <div class="form-row">
            <div class="form-col flex-2">
              <label data-i18n="add_target_label">대상 (도메인, URL, 또는 웹스토어 32자리 ID)</label>
              <input type="text" id="newTarget" data-i18n-placeholder="add_target_placeholder" placeholder="예: bad-domain.com 또는 [32자리 확장ID]" required>
            </div>
            <div class="form-col">
              <label data-i18n="add_type_label">유형</label>
              <select id="newType">
                <option value="url" data-i18n="type_url">URL</option>
                <option value="domain" data-i18n="type_domain">도메인 전체</option>
                <option value="webstore" data-i18n="type_webstore">크롬 웹스토어 ID</option>
              </select>
            </div>
            <div class="form-col">
              <label data-i18n="add_action_label">처리 액션</label>
              <select id="newAction">
                <option value="block" data-i18n="action_block">사전 차단</option>
                <option value="warn" data-i18n="action_warn">주의</option>
                <option value="hide" data-i18n="action_hide">링크 숨김</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-col flex-3">
              <label data-i18n="add_memo_label">사유 메모</label>
              <input type="text" id="newMemo" data-i18n-placeholder="add_memo_placeholder" placeholder="차단/주의를 권고하는 구체적인 사유를 적어주세요">
            </div>
            <div class="form-col btn-col">
              <button type="submit" class="btn btn-primary" data-i18n="add_submit_btn">규칙 추가</button>
            </div>
          </div>
        </form>
      </section>

      <!-- 목록 관리 카드 -->
      <section class="card list-card">
        <div class="list-header">
          <h2 data-i18n="list_card_title">등록된 규칙 목록</h2>
          <div class="filter-controls">
            <input type="text" id="searchInput" data-i18n-placeholder="search_placeholder" placeholder="대상 또는 메모 검색..." class="search-input">
            <div class="filter-tabs">
              <button class="tab-btn active" data-filter="all" data-i18n="filter_all">전체</button>
              <button class="tab-btn" data-filter="block" data-i18n="filter_block">차단</button>
              <button class="tab-btn" data-filter="warn" data-i18n="filter_warn">주의</button>
              <button class="tab-btn" data-filter="hide" data-i18n="filter_hide">숨김</button>
            </div>
          </div>
        </div>

        <div class="table-container">
          <table class="rules-table">
            <thead>
              <tr>
                <th class="col-target" data-i18n="th_target">대상 및 유형</th>
                <th class="col-action" data-i18n="th_action">액션</th>
                <th class="col-memo" data-i18n="th_memo">기록된 사유 메모</th>
                <th class="col-date" data-i18n="th_date">등록일</th>
                <th class="col-manage" data-i18n="th_manage">관리</th>
              </tr>
            </thead>
            <tbody id="rulesTableBody">
              <!-- 동적 생성 -->
            </tbody>
          </table>
          <div id="emptyMsg" class="empty-msg" style="display: none;">
            <img src="../resources/ban_mobile.png" class="empty-van-img" alt="Ban-Mobile">
            <p data-i18n="empty_rules">크롬 시티가 평화롭습니다. 등록된 지뢰 사이트 규칙이 없습니다.</p>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- 규칙 수정 모달 (마우스 클릭으로 액션 및 메모 변경) -->
  <div id="editModal" class="modal-overlay" style="display: none;">
    <div class="modal-card">
      <div class="modal-header">
        <h3 data-i18n="modal_edit_title">규칙 수정</h3>
        <button id="modalCloseBtn" class="modal-close" type="button" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body">
        <div class="modal-field">
          <label class="modal-label" data-i18n="modal_target_label">대상</label>
          <div id="modalTargetDisplay" class="modal-target-box"></div>
        </div>

        <div class="modal-field">
          <label class="modal-label" data-i18n="modal_action_label">처리 액션 선택 (클릭)</label>
          <div class="modal-action-grid">
            <label class="modal-action-card block">
              <input type="radio" name="modalAction" value="block">
              <div class="card-inner">
                <span class="icon">🚫</span>
                <div class="text">
                  <strong data-i18n="action_block_title">사전 차단</strong>
                  <small data-i18n="action_block_desc">접속 시 즉시 차단 화면 표시</small>
                </div>
              </div>
            </label>
            <label class="modal-action-card warn">
              <input type="radio" name="modalAction" value="warn">
              <div class="card-inner">
                <span class="icon">⚠️</span>
                <div class="text">
                  <strong data-i18n="action_warn_title">주의</strong>
                  <small data-i18n="action_warn_desc">배지 표시 및 취소선</small>
                </div>
              </div>
            </label>
            <label class="modal-action-card hide">
              <input type="radio" name="modalAction" value="hide">
              <div class="card-inner">
                <span class="icon">
                  <svg class="icon-closed-eye" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2 10s4 6 10 6 10-6 10-6"/>
                    <path d="m5 14-1.8 2.3"/>
                    <path d="m9 16.5-0.8 2.8"/>
                    <path d="m15 16.5 0.8 2.8"/>
                    <path d="m19 14 1.8 2.3"/>
                  </svg>
                </span>
                <div class="text">
                  <strong data-i18n="action_hide_title">링크 숨김</strong>
                  <small data-i18n="action_hide_desc">웹페이지 내 링크 숨김</small>
                </div>
              </div>
            </label>
          </div>
        </div>

        <div class="modal-field">
          <label class="modal-label" data-i18n="modal_memo_label">사유 메모</label>
          <input type="text" id="modalMemoInput" class="modal-input" placeholder="차단 또는 주의 사유를 입력하세요">
        </div>
      </div>
      <div class="modal-footer">
        <button id="modalCancelBtn" class="btn btn-outline" type="button" data-i18n="btn_cancel">취소</button>
        <button id="modalSaveBtn" class="btn btn-primary" type="button" data-i18n="btn_save">저장</button>
      </div>
    </div>
  </div>

  <script src="../i18n.js"></script>
  <script src="options.js"></script>
</body>
</html>
