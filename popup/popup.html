<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>BanMan - Chrome City Protector</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="logo-title">
        <img src="../icons/face-b-badge-48.png" class="banman-header-icon" alt="BanMan">
        <div class="brand-text">
          <h2 data-i18n="app_name">BanMan</h2>
          <p class="header-slogan" data-i18n="app_slogan">Ban & Flag bad URLs for Chrome city</p>
        </div>
      </div>
      <div class="header-right">
        <button id="openOptionsBtn" class="btn-dashboard" data-i18n-title="options_btn">
          <span data-i18n="options_btn">설정 및 목록 ⚙️</span>
        </button>
        <select id="langSelect" class="lang-select" title="Language / 언어">
          <option value="ko">🇰🇷 한국어</option>
          <option value="en">🇺🇸 English</option>
          <option value="ja">🇯🇵 日本語</option>
        </select>
      </div>
    </header>

    <!-- 대상 URL 안내 영역 (소제목 추가) -->
    <div class="form-group">
      <label class="form-label" data-i18n="target_header">감지된 대상 URL / 사이트:</label>
      <div id="targetCard" class="target-card">
        <div class="target-header">
          <span id="targetTypeBadge" class="badge" data-i18n="detecting">감지 중...</span>
          <span id="targetDomain" class="domain-text"></span>
        </div>
        <div id="targetUrlText" class="url-text" data-i18n="checking_url">URL 확인 중...</div>
      </div>
    </div>

    <!-- 일반 웹페이지일 때 타겟 범위 선택 (기본값: 현재 URL만) -->
    <div id="scopeSelector" class="form-group" style="display: none;">
      <label class="form-label" data-i18n="target_scope">적용 대상 범위:</label>
      <div class="segmented-control">
        <label class="segment">
          <input type="radio" name="targetScope" value="url" checked>
          <span data-i18n="scope_url">현재 URL만</span>
        </label>
        <label class="segment">
          <input type="radio" name="targetScope" value="domain">
          <span data-i18n="scope_domain">도메인 전체</span>
        </label>
      </div>
    </div>

    <!-- 처리 방식 선택 -->
    <div class="form-group">
      <label class="form-label" data-i18n="action_type">처리 방식 (액션):</label>
      <div class="action-grid">
        <label class="action-card">
          <input type="radio" name="actionType" value="block" checked>
          <div class="card-content block">
            <span class="act-icon">🚫</span>
            <div class="act-info">
              <strong data-i18n="action_block_title">사전 차단</strong>
              <small data-i18n="action_block_desc">진입 시 차단 화면</small>
            </div>
          </div>
        </label>

        <label class="action-card">
          <input type="radio" name="actionType" value="warn">
          <div class="card-content warn">
            <span class="act-icon">⚠️</span>
            <div class="act-info">
              <strong data-i18n="action_warn_title">주의</strong>
              <small data-i18n="action_warn_desc">배지 / 취소선</small>
            </div>
          </div>
        </label>

        <label class="action-card">
          <input type="radio" name="actionType" value="hide">
          <div class="card-content hide">
            <span class="act-icon">
              <svg class="icon-closed-eye" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 10s4 6 10 6 10-6 10-6"/>
                <path d="m5 14-1.8 2.3"/>
                <path d="m9 16.5-0.8 2.8"/>
                <path d="m15 16.5 0.8 2.8"/>
                <path d="m19 14 1.8 2.3"/>
              </svg>
            </span>
            <div class="act-info">
              <strong data-i18n="action_hide_title">링크 숨김</strong>
              <small data-i18n="action_hide_desc">타 사이트서 은닉</small>
            </div>
          </div>
        </label>
      </div>
    </div>

    <!-- 사유 메모 입력 -->
    <div class="form-group">
      <label for="memoInput" class="form-label" data-i18n="memo_label">차단 / 비추천 사유 메모:</label>
      <textarea id="memoInput" data-i18n-placeholder="memo_placeholder" placeholder="예: 낚시성 뉴스, 메모리 누수 버그, 광고 과다 등"></textarea>
    </div>

    <!-- 액션 버튼 -->
    <div class="btn-group">
      <button id="saveBtn" class="btn btn-primary" data-i18n="save_btn_add">블랙리스트 등록</button>
      <button id="deleteBtn" class="btn btn-secondary" style="display: none;" data-i18n="delete_btn">해제</button>
    </div>

    <div id="statusMsg" class="status-msg"></div>
  </div>

  <script src="../i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
